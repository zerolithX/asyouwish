          cat > app/src/main/java/com/example/sleepreply/OpenRouter.kt <<'EOF'
          package com.example.sleepreply

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object OpenRouter {

              class Turn(val role: String, val text: String)

              class HttpException(val code: Int, message: String) : Exception(message)

              fun reply(apiKey: String, model: String, instructions: String, turns: List<Turn>): String {
                  // merge consecutive turns from the same side
                  val merged = ArrayList<Turn>()
                  for (t in turns) {
                      if (merged.isNotEmpty() && merged.last().role == t.role) {
                          val prev = merged.removeAt(merged.size - 1)
                          merged.add(Turn(t.role, prev.text + "\n" + t.text))
                      } else {
                          merged.add(t)
                      }
                  }

                  val messages = JSONArray()
                  messages.put(JSONObject().put("role", "system").put("content", instructions))
                  for (t in merged) {
                      messages.put(JSONObject().put("role", t.role).put("content", t.text))
                  }

                  val body = JSONObject()
                      .put("model", model.trim())
                      .put("messages", messages)
                      .put("max_tokens", 512)
                      .put("temperature", 0.8)

                  val url = URL("https://openrouter.ai/api/v1/chat/completions")
                  val conn = url.openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 15000
                      conn.readTimeout = 45000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("Authorization", "Bearer " + apiKey.trim())
                      conn.setRequestProperty("X-Title", "AutoBot WM")
                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val response = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw HttpException(code, "HTTP " + code + ": " + response)

                      val json = JSONObject(response)
                      val err = json.optJSONObject("error")
                      if (err != null) throw Exception(err.optString("message", "OpenRouter error"))

                      val choices = json.optJSONArray("choices")
                      if (choices == null || choices.length() == 0) throw Exception("No reply from OpenRouter")
                      val msg = choices.getJSONObject(0).optJSONObject("message")
                      val out = if (msg == null || msg.isNull("content")) "" else msg.optString("content").trim()
                      if (out.isEmpty()) throw Exception("Empty reply from OpenRouter")
                      return out
                  } finally {
                      conn.disconnect()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/sleepreply/ReplyService.kt <<'EOF'
          package com.example.sleepreply

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.RemoteInput
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.util.Calendar
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          class ReplyService : NotificationListenerService() {

              private val lastSeen = HashMap<String, String>()
              private val lastReply = ConcurrentHashMap<String, String>()
              private val history = HashMap<String, ArrayList<OpenRouter.Turn>>()
              private val worker = Executors.newSingleThreadExecutor()

              override fun onDestroy() {
                  worker.shutdown()
                  super.onDestroy()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val prefs = getSharedPreferences(Prefs.NAME, Context.MODE_PRIVATE)
                  if (!prefs.getBoolean(Prefs.ENABLED, true)) return
                  if (sbn.packageName !in listOf("com.whatsapp", "com.whatsapp.w4b", "com.facebook.orca", "com.facebook.mlite")) return
                  if (prefs.getBoolean(Prefs.USE_WINDOW, true) &&
                      !inSleepWindow(prefs.getInt(Prefs.START, 23 * 60), prefs.getInt(Prefs.END, 7 * 60))
                  ) return

                  val n = sbn.notification
                  if ((n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                  if (n.extras.getBoolean(Notification.EXTRA_IS_GROUP_CONVERSATION, false)) return

                  val title = n.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = n.extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val customMessage = prefs.getString(Prefs.MESSAGE, Prefs.DEFAULT_MESSAGE) ?: Prefs.DEFAULT_MESSAGE
                  val aiMode = prefs.getString(Prefs.MODE, Prefs.MODE_CUSTOM) == Prefs.MODE_AI

                  // ignore our own replies showing up as notifications
                  if (customMessage.isNotEmpty() && text.contains(customMessage)) return
                  val previous = lastReply[title]
                  if (previous != null && (text == previous || text.endsWith(": " + previous))) return

                  val signature = n.`when`.toString() + "|" + text
                  if (lastSeen[title] == signature) return

                  val action = findReplyAction(n) ?: return
                  lastSeen[title] = signature

                  if (!aiMode) {
                      if (customMessage.isBlank()) return
                      if (sendReply(action, customMessage)) lastReply[title] = customMessage
                      return
                  }

                  if (text.isBlank()) return
                  val key = prefs.getString(Prefs.API_KEY, "") ?: ""
                  val model = (prefs.getString(Prefs.MODEL, Prefs.DEFAULT_MODEL) ?: "").ifBlank { Prefs.DEFAULT_MODEL }
                  val instructions = (prefs.getString(Prefs.INSTRUCTIONS, Prefs.DEFAULT_INSTRUCTIONS) ?: "")
                      .ifBlank { Prefs.DEFAULT_INSTRUCTIONS }

                  worker.execute {
                      val turns = history.getOrPut(title) { ArrayList() }
                      turns.add(OpenRouter.Turn("user", text))
                      while (turns.size > 10) turns.removeAt(0)
                      while (turns.isNotEmpty() && turns[0].role != "user") turns.removeAt(0)

                      val aiReply: String? = if (key.isNotBlank()) {
                          try {
                              OpenRouter.reply(key, model, instructions, ArrayList(turns))
                          } catch (e: Exception) {
                              null
                          }
                      } else {
                          null
                      }

                      // if AI fails (no internet, bad key, quota), fall back to the custom message
                      val finalReply = aiReply ?: customMessage
                      if (finalReply.isBlank()) return@execute

                      if (sendReply(action, finalReply)) {
                          lastReply[title] = finalReply
                          if (aiReply != null) turns.add(OpenRouter.Turn("assistant", aiReply))
                      }
                  }
              }

              private fun sendReply(action: Notification.Action, reply: String): Boolean {
                  val inputs = action.remoteInputs ?: return false
                  val input = inputs.firstOrNull() ?: return false
                  val fill = Intent()
                  val results = Bundle()
                  results.putCharSequence(input.resultKey, reply)
                  RemoteInput.addResultsToIntent(inputs, fill, results)
                  return try {
                      action.actionIntent.send(this, 0, fill)
                      true
                  } catch (e: PendingIntent.CanceledException) {
                      false
                  }
              }

              private fun findReplyAction(n: Notification): Notification.Action? {
                  val all = ArrayList<Notification.Action>()
                  n.actions?.let { all.addAll(it) }
                  all.addAll(Notification.WearableExtender(n).actions)
                  return all.firstOrNull { a -> a.remoteInputs?.isNotEmpty() == true }
              }

              private fun inSleepWindow(start: Int, end: Int): Boolean {
                  val c = Calendar.getInstance()
                  val now = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE)
                  return if (start <= end) now in start until end else (now >= start || now < end)
              }
          }
