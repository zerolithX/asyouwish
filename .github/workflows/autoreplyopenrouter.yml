      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoBotWM-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AutoBotWM-release.apk

      - name: Save APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBotWM-APKs
          path: dist/*.apk

      - name: Publish APKs to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "autobot-v${{ github.run_number }}"
          dist/AutoBotWM-debug.apk
          dist/AutoBotWM-release.apk
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "AutoBot WM build ${{ github.run_number }}"
