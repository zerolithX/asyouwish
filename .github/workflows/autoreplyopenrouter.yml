          cat > app/src/main/java/com/example/sleepreply/MainActivity.kt <<'EOF'
          package com.example.sleepreply

          import android.app.Activity
          import android.app.TimePickerDialog
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var accessStatus: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences(Prefs.NAME, Context.MODE_PRIVATE)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  fun label(t: String): TextView {
                      val v = TextView(this)
                      v.text = t
                      v.setPadding(0, pad / 2, 0, 0)
                      return v
                  }

                  val heading = TextView(this)
                  heading.text = "AutoBot WM"
                  heading.textSize = 24f
                  root.addView(heading)

                  accessStatus = TextView(this)
                  root.addView(accessStatus)

                  val accessButton = Button(this)
                  accessButton.text = "Open notification access settings"
                  accessButton.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }
                  root.addView(accessButton)

                  val enabled = Switch(this)
                  enabled.text = "Auto-reply on"
                  enabled.isChecked = prefs.getBoolean(Prefs.ENABLED, true)
                  enabled.setOnCheckedChangeListener { _, on ->
                      prefs.edit().putBoolean(Prefs.ENABLED, on).apply()
                  }
                  root.addView(enabled)

                  val windowSwitch = Switch(this)
                  windowSwitch.text = "Only reply during the time window"
                  windowSwitch.isChecked = prefs.getBoolean(Prefs.USE_WINDOW, true)
                  windowSwitch.setOnCheckedChangeListener { _, on ->
                      prefs.edit().putBoolean(Prefs.USE_WINDOW, on).apply()
                  }
                  root.addView(windowSwitch)

                  val startButton = Button(this)
                  val endButton = Button(this)
                  fun refresh() {
                      startButton.text = "Start: " + format(prefs.getInt(Prefs.START, 23 * 60))
                      endButton.text = "End: " + format(prefs.getInt(Prefs.END, 7 * 60))
                  }
                  startButton.setOnClickListener { pickTime(Prefs.START, 23 * 60) { refresh() } }
                  endButton.setOnClickListener { pickTime(Prefs.END, 7 * 60) { refresh() } }
                  refresh()
                  root.addView(startButton)
                  root.addView(endButton)

                  // ---- reply mode ----
                  root.addView(label("Reply mode"))
                  val group = RadioGroup(this)
                  val rbCustom = RadioButton(this)
                  rbCustom.id = View.generateViewId()
                  rbCustom.text = "Custom message"
                  val rbAi = RadioButton(this)
                  rbAi.id = View.generateViewId()
                  rbAi.text = "AI reply (OpenRouter)"
                  group.addView(rbCustom)
                  group.addView(rbAi)
                  val aiOn = prefs.getString(Prefs.MODE, Prefs.MODE_CUSTOM) == Prefs.MODE_AI
                  group.check(if (aiOn) rbAi.id else rbCustom.id)
                  root.addView(group)

                  // ---- AI settings ----
                  val aiBox = LinearLayout(this)
                  aiBox.orientation = LinearLayout.VERTICAL
                  aiBox.visibility = if (aiOn) View.VISIBLE else View.GONE

                  aiBox.addView(label("OpenRouter API key"))
                  val keyInput = EditText(this)
                  keyInput.hint = "Paste your OpenRouter key (sk-or-...)"
                  keyInput.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  keyInput.setText(prefs.getString(Prefs.API_KEY, "") ?: "")
                  aiBox.addView(keyInput)

                  aiBox.addView(label("Model (OpenRouter ID, e.g. openai/gpt-4o-mini)"))
                  val modelInput = EditText(this)
                  modelInput.inputType = InputType.TYPE_CLASS_TEXT
                  modelInput.setText(prefs.getString(Prefs.MODEL, Prefs.DEFAULT_MODEL) ?: Prefs.DEFAULT_MODEL)
                  aiBox.addView(modelInput)

                  aiBox.addView(label("AI instructions (how it should reply)"))
                  val instrInput = EditText(this)
                  instrInput.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                  instrInput.minLines = 4
                  instrInput.setText(prefs.getString(Prefs.INSTRUCTIONS, Prefs.DEFAULT_INSTRUCTIONS) ?: Prefs.DEFAULT_INSTRUCTIONS)
                  aiBox.addView(instrInput)

                  val test = Button(this)
                  test.text = "Test AI reply"
                  test.setOnClickListener {
                      val key = keyInput.text.toString().trim()
                      val model = modelInput.text.toString().trim().ifEmpty { Prefs.DEFAULT_MODEL }
                      if (key.isEmpty()) {
                          Toast.makeText(this, "Enter your API key first", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      Toast.makeText(this, "Testing...", Toast.LENGTH_SHORT).show()
                      Thread {
                          val result = try {
                              "AI says: " + OpenRouter.reply(
                                  key,
                                  model,
                                  "Reply with one short friendly sentence.",
                                  listOf(OpenRouter.Turn("user", "Hi, are you there?"))
                              )
                          } catch (e: Exception) {
                              "Failed: " + (e.message ?: "unknown error").take(200)
                          }
                          runOnUiThread { Toast.makeText(this, result, Toast.LENGTH_LONG).show() }
                      }.start()
                  }
                  aiBox.addView(test)
                  root.addView(aiBox)

                  group.setOnCheckedChangeListener { _, id ->
                      val ai = id == rbAi.id
                      prefs.edit().putString(Prefs.MODE, if (ai) Prefs.MODE_AI else Prefs.MODE_CUSTOM).apply()
                      aiBox.visibility = if (ai) View.VISIBLE else View.GONE
                  }

                  // ---- custom message ----
                  root.addView(label("Custom message (also sent if the AI fails)"))
                  val message = EditText(this)
                  message.setText(prefs.getString(Prefs.MESSAGE, Prefs.DEFAULT_MESSAGE) ?: Prefs.DEFAULT_MESSAGE)
                  root.addView(message)

                  val save = Button(this)
                  save.text = "Save settings"
                  save.setOnClickListener {
                      prefs.edit()
                          .putString(Prefs.MESSAGE, message.text.toString())
                          .putString(Prefs.API_KEY, keyInput.text.toString().trim())
                          .putString(Prefs.MODEL, modelInput.text.toString().trim().ifEmpty { Prefs.DEFAULT_MODEL })
                          .putString(Prefs.INSTRUCTIONS, instrInput.text.toString().ifBlank { Prefs.DEFAULT_INSTRUCTIONS })
                          .apply()
                      Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show()
                  }
                  root.addView(save)

                  val note = TextView(this)
                  note.text = "Replies to WhatsApp and Messenger messages (not group chats). In AI mode the incoming message text is sent to OpenRouter (and the model provider you choose) to write the reply."
                  note.setPadding(0, pad / 2, 0, 0)
                  root.addView(note)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  val list = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  accessStatus.text = if (list.contains(packageName)) {
                      "Notification access: ON"
                  } else {
                      "Notification access: OFF. Tap the button below and allow AutoBot WM."
                  }
              }

              private fun pickTime(key: String, def: Int, done: () -> Unit) {
                  val cur = prefs.getInt(key, def)
                  TimePickerDialog(this, { _, h, m ->
                      prefs.edit().putInt(key, h * 60 + m).apply()
                      done()
                  }, cur / 60, cur % 60, true).show()
              }

              private fun format(mins: Int): String = String.format("%02d:%02d", mins / 60, mins % 60)
          }
          EOF

